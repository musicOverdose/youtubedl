# Top-level Docker Compose project name.
# NOTE: '-p <name>' CLI flag and 'COMPOSE_PROJECT_NAME' environment variable take
# higher precedence than this top-level 'name' field.
# Explicitly set to 'youtubedl' to avoid accidental directory-based names (e.g. '19_*' in Portainer).
name: youtubedl

services:
  postgres:
    image: postgres:16-alpine
    container_name: ytdl_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ytdl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ytdl_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ytdl_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ytdl_user} -d ${POSTGRES_DB:-ytdl_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ytdl_network

  redis:
    image: redis:7-alpine
    container_name: ytdl_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ytdl_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: ytdl_web
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-8087}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      - WEB_PORT=8080
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
      - ADMIN_PASSWORD_RESET=${ADMIN_PASSWORD_RESET:-false}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://ytdl_user:ytdl_secure_pass@postgres:5432/ytdl_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - web_secrets:/config/master:rw
      - bot_runtime_secrets:/config/runtime:rw
      - bot_runtime_state:/config/state:rw
      - local_api_config:/config/bot-api:rw
      - cookie_secrets:/config/secrets:rw
    networks:
      ytdl_network:
        aliases:
          - ytdl_web

  telegram-bot-api:
    build:
      context: .
      dockerfile: Dockerfile.localbotapi
    container_name: ytdl_local_bot_api
    restart: unless-stopped
    user: "101:101"
    volumes:
      - local_api_config:/config/bot-api:ro
      - telegram_upload_tmp:/transfer:ro
      - telegram_bot_api_temp:/tmp/telegram-bot-api:rw
      - telegram_bot_api_data:/var/lib/telegram-bot-api:rw
    networks:
      - ytdl_network

  telegram-bot-api-telemetry:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: ytdl_local_bot_api_telemetry
    restart: unless-stopped
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - telegram_bot_api_temp:/tmp/telegram-bot-api:ro
      - telegram_bot_api_data:/var/lib/telegram-bot-api:ro
    command: ["python3", "-m", "src.telemetry.local_bot_api"]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ytdl_network

  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: bot
    container_name: ytdl_bot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://ytdl_user:ytdl_secure_pass@postgres:5432/ytdl_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - bot_runtime_secrets:/config/runtime:ro
      - bot_runtime_state:/config/state:ro
      - cookie_secrets:/config/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - ytdl_network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: ytdl_worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://ytdl_user:ytdl_secure_pass@postgres:5432/ytdl_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - bot_runtime_secrets:/config/runtime:ro
      - bot_runtime_state:/config/state:ro
      - cookie_secrets:/config/secrets:ro
      - temp_data:/tmp/ytdl:rw
      - telegram_upload_tmp:/transfer:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ytdl_network

networks:
  ytdl_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  web_secrets:
  bot_runtime_secrets:
  bot_runtime_state:
  local_api_config:
  cookie_secrets:
  telegram_upload_tmp:
  telegram_bot_api_temp:
  telegram_bot_api_data:
  temp_data:
